<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:" />
    <title>Pal</title>
    <style>
      /* 启动画面：纯静态，无 JS —— 主进程 loadFile 后立即可绘，不依赖渲染层 bundle 加载完成 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        cursor: default;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        /* 与主界面主题同色的深底，避免启动瞬间闪白 */
        background: radial-gradient(120% 120% at 30% 15%, #14304a 0%, #0d1a26 55%, #0a1219 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Roboto, sans-serif;
        /* 窗口本身无边框（见主进程），圆角由这里画 */
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .mark {
        width: 84px;
        height: 84px;
        filter: drop-shadow(0 8px 24px rgba(15, 118, 110, 0.45));
      }
      .name {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-indent: 0.14em;
        color: #f2f7fa;
      }
      .caption {
        font-size: 12px;
        letter-spacing: 0.06em;
        color: rgba(242, 247, 250, 0.42);
      }
      /* 底部细进度条：不确定态，纯 CSS 循环 */
      .track {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.06);
      }
      .bar {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 34%;
        background: linear-gradient(90deg, transparent, #2dd4bf, transparent);
        animation: slide 1.15s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          left: -34%;
        }
        100% {
          left: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar {
          animation: none;
          left: 0;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <!-- 「P」标志：与 build/icon.svg、scripts/gen-icon.mjs 同一几何（竖笔 + 右上半圆碗） -->
    <svg class="mark" viewBox="0 0 1024 1024" aria-hidden="true">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#0f766e" />
          <stop offset="1" stop-color="#1e40af" />
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)" />
      <g stroke="#ffffff" stroke-width="172" fill="none">
        <line x1="342" y1="250" x2="342" y2="790" />
        <path d="M400 265 A190 190 0 0 1 400 645" />
      </g>
    </svg>
    <div class="name">Pal</div>
    <div class="caption">正在启动…</div>
    <div class="track"><div class="bar"></div></div>
  </body>
</html>
