<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形底板 -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- 「P」：竖笔 + 右上半圆碗（与 scripts/gen-icon.mjs、tray-icon.ts 同一几何） -->
  <g fill="none" stroke="#FFFFFF" stroke-width="172">
    <!-- 竖笔：y 250→790 -->
    <line x1="342" y1="250" x2="342" y2="790"/>
    <!-- 碗：圆心 (400,455)，中线半径 190，只取右半 -->
    <path d="M400 265 A190 190 0 0 1 400 645"/>
  </g>
</svg>
